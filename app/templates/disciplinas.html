{% extends "base.html" %}

{% block conteudo %}
<div class="card">
    <h2>Cadastrar Disciplina</h2>

    <form method="post">
        <input type="text" name="nome" placeholder="Nome da disciplina" required>
        <input type="number" name="dificuldade" min="1" max="5" placeholder="Dificuldade (1-5)" required>
        <input type="number" name="prioridade" min="1" max="5" placeholder="Prioridade (1-5)" required>
        <button type="submit">Cadastrar</button>
    </form>
</div>

<div class="card">
    <h2>Disciplinas Cadastradas</h2>

    <ul>
        {% for d in disciplinas %}
            <li>
                <strong>{{ d.nome }}</strong> —
                Dificuldade: {{ d.dificuldade }},
                Prioridade: {{ d.prioridade }}
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
