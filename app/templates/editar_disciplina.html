{% extends "base.html" %}

{% block title %}Editar Disciplina{% endblock %}

{% block content %}
<div class="col-md-8">
    <div class="card p-4">
        <h3 class="mb-4">Editar Disciplina</h3>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Nome da Disciplina</label>
                <input type="text" name="nome" class="form-control" value="{{ disciplina.nome }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Carga Horária</label>
                <input type="number" name="carga_horaria" class="form-control" value="{{ disciplina.carga_horaria }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Ementa</label>
                <textarea name="ementa" class="form-control" rows="5">{{ disciplina.ementa }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Substituir Plano de Ensino (PDF)</label>
                {% if disciplina.arquivo_pdf %}
                    <p class="text-muted small mb-1">Arquivo atual: <strong>{{ disciplina.arquivo_pdf }}</strong></p>
                {% endif %}
                <input type="file" name="plano_pdf" class="form-control" accept="application/pdf">
                <div class="form-text">Deixe em branco para manter o PDF atual.</div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success w-100">Salvar Alterações</button>
                <a href="{{ url_for('main.cadastrar_disciplina') }}" class="btn btn-outline-secondary w-100">Cancelar</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
